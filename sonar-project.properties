sonar.projectKey=JasonSafari_Group-3-Budget-Tracker
sonar.organization=jasonsafari
sonar.sources=.
# Non-code files and build output are excluded from analysis.
sonar.exclusions=**/*.csv,**/*.vcxproj*,**/*.sln,**/*.md,tests/**,**/Debug/**,**/Release/**,**/x64/**,**/.vs/**,build_wrapper_output/**,.github/**
# Unit tests live in tests/ (excluded from main sources, indexed as tests).
sonar.tests=tests
sonar.test.inclusions=tests/**/*.c
# Coverage report path is passed by the workflow (-Dsonar.coverageReportPaths).
sonar.coverage.exclusions=tests/**
sonar.sourceEncoding=UTF-8
